<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你的名字 | Personal Space</title>
<style>
  :root{
    --bg:#08090d;
    --text:#e8eaf0;
    --muted:#8b90a0;
    --border:rgba(255,255,255,.08);
    --glass:rgba(255,255,255,.04);
    --accent1:#6366f1;
    --accent2:#a855f7;
    --accent3:#22d3ee;
    --radius:20px;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  html,body{height:100%}

  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                "PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }

  /* 背景渐变光晕 */
  .glow{
    position:fixed;
    border-radius:50%;
    filter:blur(120px);
    opacity:.55;
    pointer-events:none;
    z-index:0;
    animation:float 14s ease-in-out infinite;
  }
  .glow-1{width:480px;height:480px;background:var(--accent1);top:-160px;left:-120px}
  .glow-2{width:420px;height:420px;background:var(--accent2);bottom:-160px;right:-120px;animation-delay:-5s}
  .glow-3{width:320px;height:320px;background:var(--accent3);top:40%;left:55%;opacity:.3;animation-delay:-9s}

  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(30px,-30px) scale(1.08)}
    66%{transform:translate(-20px,20px) scale(.95)}
  }

  /* 玻璃卡片 */
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:560px;
    padding:56px 44px 40px;
    border-radius:var(--radius);
    background:var(--glass);
    border:1px solid var(--border);
    backdrop-filter:blur(24px) saturate(160%);
    -webkit-backdrop-filter:blur(24px) saturate(160%);
    box-shadow:
      0 24px 64px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.06);
    text-align:center;
    animation:rise .8s cubic-bezier(.22,1,.36,1) both;
  }

  @keyframes rise{
    from{opacity:0;transform:translateY(24px) scale(.98)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }

  /* 头像：渐变描边 + 呼吸光 */
  .avatar-wrap{
    position:relative;
    width:108px;height:108px;
    margin:0 auto 22px;
  }
  .avatar-wrap::before{
    content:"";
    position:absolute;inset:-6px;
    border-radius:50%;
    background:conic-gradient(from 0deg,var(--accent1),var(--accent2),var(--accent3),var(--accent1));
    filter:blur(10px);
    opacity:.65;
    animation:spin 6s linear infinite;
  }
  .avatar{
    position:relative;
    width:100%;height:100%;
    border-radius:50%;
    background:linear-gradient(135deg,#1a1c25,#0f1016);
    border:1px solid rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:700;
    letter-spacing:1px;
    background-clip:padding-box;
    color:#fff;
    overflow:hidden;
  }
  .avatar span{
    background:linear-gradient(135deg,var(--accent3),var(--accent2),var(--accent1));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  @keyframes spin{to{transform:rotate(360deg)}}

  h1{
    font-size:30px;
    font-weight:700;
    letter-spacing:-.5px;
    margin-bottom:10px;
    background:linear-gradient(135deg,#fff,#b8bcd0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .tagline{
    font-size:14px;
    color:var(--muted);
    letter-spacing:.5px;
    margin-bottom:8px;
  }

  .bio{
    font-size:15px;
    line-height:1.75;
    color:#b9bdcc;
    max-width:400px;
    margin:18px auto 30px;
  }

  /* 链接按钮 */
  .links{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }

  .links a{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:10px 20px;
    border-radius:999px;
    font-size:14px;
    font-weight:500;
    text-decoration:none;
    color:var(--text);
    background:rgba(255,255,255,.04);
    border:1px solid var(--border);
    transition:all .25s cubic-bezier(.22,1,.36,1);
    overflow:hidden;
  }

  .links a::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    opacity:0;
    transition:opacity .25s ease;
    z-index:-1;
  }

  .links a:hover{
    transform:translateY(-2px);
    border-color:transparent;
    color:#fff;
    box-shadow:0 8px 24px rgba(99,102,241,.35);
  }
  .links a:hover::before{opacity:1}

  footer{
    margin-top:34px;
    padding-top:20px;
    border-top:1px solid var(--border);
    font-size:12px;
    color:#5f6474;
    letter-spacing:.3px;
  }

  @media(max-width:520px){
    .card{padding:40px 26px 32px}
    h1{font-size:24px}
    .glow{filter:blur(90px)}
  }

  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>

  <!-- 背景光晕 -->
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>

  <main class="card">
    <div class="avatar-wrap">
      <div class="avatar"><span>你</span></div>
    </div>

    <h1>你的名字</h1>
    <p class="tagline">Developer · Creator · Dreamer</p>

    <p class="bio">
      这里写一句你的介绍。比如：热爱构建有趣的东西，
      专注前端与设计，偶尔写点文字。
    </p>

    <nav class="links">
      <a href="https://github.com/你的用户名" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:你的邮箱@example.com">Email</a>
      <a href="https://twitter.com/你的用户名" target="_blank" rel="noopener">Twitter</a>
      <a href="https://你的博客.com" target="_blank" rel="noopener">Blog</a>
    </nav>

    <footer>© 2026 你的名字 · Built with ❤️</footer>
  </main>

</body>
</html>
